<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="100%" height="100%" fill="none">
  <!-- Soft background circle pattern (dotted) -->
  <circle cx="256" cy="192" r="170" fill="none" stroke="#D4A843" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" />
  <circle cx="256" cy="192" r="162" fill="none" stroke="#C4572A" stroke-width="0.8" opacity="0.25" />

  <!-- The Ground Line -->
  <line x1="50" y1="330" x2="462" y2="330" stroke="#D4A843" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <line x1="80" y1="337" x2="432" y2="337" stroke="#C4572A" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Motion lines indicating left-to-right movement -->
  <g stroke="#D4A843" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="30" y1="180" x2="50" y2="180" />
    <line x1="15" y1="210" x2="45" y2="210" stroke-width="1.5" />
    <line x1="25" y1="240" x2="55" y2="240" />
  </g>

  <!-- Headlight beam glow (flat vector shape) -->
  <polygon points="418,228 490,205 490,265 418,242" fill="rgba(245, 236, 200, 0.25)" opacity="0.8" />
  <line x1="418" y1="228" x2="490" y2="205" stroke="#D4A843" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="418" y1="242" x2="490" y2="265" stroke="#D4A843" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- RICKSHAW GROUP -->
  <g id="rickshaw-body">
    <!-- FRONT WHEEL & FORK (Right side) -->
    <!-- Wheel Fork / Suspension arm -->
    <path d="M 378, 290 L 366, 236" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round" />
    <path d="M 366, 236 L 360, 210" stroke="#A0A0A0" stroke-width="5" />
    <!-- Front Mudguard (Yellow) -->
    <path d="M 345, 272 C 345, 245, 395, 245, 395, 272" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" />
    <!-- Front Wheel (Tire + Rim) -->
    <circle cx="378" cy="290" r="32" fill="#1E1E1E" stroke="#2D2D2D" stroke-width="3" />
    <circle cx="378" cy="290" r="20" fill="#E5A93B" stroke="#2D2D2D" stroke-width="2.5" />
    <circle cx="378" cy="290" r="8" fill="#A0A0A0" stroke="#2D2D2D" stroke-width="2" />
    <!-- Front Mud Flap (Black) -->
    <path d="M 345, 272 L 340, 290" stroke="#2D2D2D" stroke-width="4.5" stroke-linecap="round" />

    <!-- REAR WHEEL & SHOCK ABSORBER (Left side) -->
    <!-- Rear Mudguard (Yellow) -->
    <path d="M 120, 285 C 120, 248, 192, 248, 192, 285" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" />
    <!-- Rear Wheel -->
    <circle cx="156" cy="290" r="32" fill="#1E1E1E" stroke="#2D2D2D" stroke-width="3" />
    <circle cx="156" cy="290" r="20" fill="#E5A93B" stroke="#2D2D2D" stroke-width="2.5" />
    <circle cx="156" cy="290" r="8" fill="#A0A0A0" stroke="#2D2D2D" stroke-width="2" />
    <!-- Rear Mud Flap (Black) -->
    <path d="M 120, 285 V 305 H 126 V 285" fill="#2D2D2D" stroke="#2D2D2D" stroke-width="1.5" />

    <!-- UNDER-CARRIAGE / CHASSIS FRAME -->
    <path d="M 156, 290 H 378" stroke="#2D2D2D" stroke-width="6.5" stroke-linecap="round" />
    <rect x="180" y="278" width="140" height="8" rx="2" fill="#2D2D2D" />

    <!-- CABIN INTERIOR & SEATS -->
    <!-- Passenger Seat Cushion (Brown/Terracotta) -->
    <rect x="108" y="222" width="56" height="15" rx="3" fill="#C4572A" stroke="#2D2D2D" stroke-width="3.5" />
    <rect x="104" y="190" width="12" height="34" rx="2" fill="#C4572A" stroke="#2D2D2D" stroke-width="3.5" />
    <!-- Driver Seat Cushion -->
    <rect x="236" y="226" width="34" height="12" rx="3" fill="#C4572A" stroke="#2D2D2D" stroke-width="3.5" />
    <!-- Driver backrest pole -->
    <line x1="236" y1="226" x2="232" y2="198" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round" />
    <circle cx="231" cy="194" r="7" fill="#C4572A" stroke="#2D2D2D" stroke-width="3" />

    <!-- MAIN BODY - YELLOW SECTIONS -->
    <!-- Front Apron / Nose Panel -->
    <path d="M 326, 280 H 360 C 372, 280, 382, 270, 386, 258 L 398, 222 L 358, 204 L 326, 230 Z" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Front Nose Center Stripe (White/Gold Accent) -->
    <path d="M 374, 250 L 394, 224" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round" />
    
    <!-- Driver Footwell panel -->
    <path d="M 270, 280 H 328 L 324, 250 H 270 Z" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Rear Cabin Wall / Fender Panel -->
    <path d="M 88, 238 H 192 V 252 H 180 C 180, 228, 132, 228, 132, 252 H 88 Z" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />
    <rect x="88" y="210" width="16" height="28" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Under-passenger seat panel -->
    <rect x="156" y="237" width="80" height="43" fill="#E5A93B" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />

    <!-- CANVAS HOOD / TOP CANOPY (Black/Charcoal Canvas) -->
    <!-- Canvas Roof Path -->
    <path d="M 88, 210 H 78 C 78, 160, 90, 108, 120, 108 H 290 C 304, 108, 310, 116, 316, 128 L 322, 142 L 250, 150 L 226, 168 L 228, 210 Z" fill="#2D2D2D" stroke="#2D2D2D" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Outer line detailing for canvas texture/folds -->
    <path d="M 120, 108 Q 130, 210, 132, 210" stroke="#1A1A1A" stroke-width="3" fill="none" />
    <path d="M 180, 108 Q 192, 180, 194, 210" stroke="#1A1A1A" stroke-width="3" fill="none" />
    <path d="M 240, 108 L 244, 152" stroke="#1A1A1A" stroke-width="3" fill="none" />

    <!-- Back Passenger Window in Canopy -->
    <rect x="140" y="126" width="66" height="42" rx="8" fill="#FFF8F0" stroke="#2D2D2D" stroke-width="3.5" />
    <!-- Window reflection line -->
    <path d="M 182, 132 L 152, 162" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 194, 134 L 174, 154" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- FRONT WINDSHIELD FRAME & GLASS -->
    <path d="M 314, 126 L 358, 204" stroke="#2D2D2D" stroke-width="4.5" stroke-linecap="round" />
    <!-- Windshield glass reflection -->
    <path d="M 326, 144 L 344, 176" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- CABIN SUPPORT PILLARS & HANDLES -->
    <!-- Center cabin structural pillar -->
    <line x1="228" y1="108" x2="228" y2="210" stroke="#2D2D2D" stroke-width="5" />
    <!-- Front entry handrail -->
    <path d="M 284, 144 V 226" stroke="#A0A0A0" stroke-width="3.5" stroke-linecap="round" />

    <!-- HANDLEBARS & CONTROLS -->
    <!-- Handlebar shaft -->
    <line x1="334" y1="210" x2="352" y2="236" stroke="#2D2D2D" stroke-width="4" />
    <!-- Handlebar grip -->
    <rect x="320" y="202" width="18" height="8" rx="2" fill="#1E1E1E" stroke="#2D2D2D" stroke-width="2" />
    
    <!-- ACCESSORIES & LIGHTS -->
    <!-- Retro Round Rearview Mirror -->
    <path d="M 322, 140 L 302, 124" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round" />
    <circle cx="300" cy="122" r="10" fill="#FFF8F0" stroke="#2D2D2D" stroke-width="3" />
    <path d="M 304, 118 L 296, 126" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front Circular Headlight -->
    <circle cx="410" cy="235" r="12" fill="#FFF8F0" stroke="#2D2D2D" stroke-width="3.5" />
    <circle cx="410" cy="235" r="7" fill="#E5A93B" />
    <!-- Little headlight visor/cap -->
    <path d="M 398, 231 Q 410, 222, 422, 231" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Rear brake light (Red) -->
    <rect x="74" y="222" width="5" height="12" rx="1" fill="#C4572A" stroke="#2D2D2D" stroke-width="2" />

    <!-- Decorative flowers/marigold garland on front nose (Indian touch) -->
    <g fill="#C4572A" stroke="#E5A93B" stroke-width="1">
      <circle cx="360" cy="214" r="4.5" />
      <circle cx="367" cy="221" r="4.5" />
      <circle cx="374" cy="228" r="4.5" />
      <circle cx="381" cy="235" r="4.5" />
    </g>
  </g>
</svg>
