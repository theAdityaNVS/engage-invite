  <path d="M 242, 94 C 240, 80, 272, 80, 270, 94 C 270, 104, 242, 104, 242, 94 Z" fill="#C4572A" stroke="#D4A843" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 246, 90 H 266" stroke="#D4A843" stroke-width="1.5" />
  <circle cx="256" cy="74" r="3.5" fill="#D4A843" />

