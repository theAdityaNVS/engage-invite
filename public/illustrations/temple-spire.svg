  <path d="M 256, 28 L 315, 45 L 256, 62 Z" fill="#C4572A" stroke="#D4A843" stroke-width="2" stroke-linejoin="round" />
  <!-- Little flag streamers -->
  <path d="M 315, 45 Q 325, 42, 335, 47" stroke="#C4572A" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 256, 45 H 275" stroke="#D4A843" stroke-width="1.5" />

  <!-- Kalasha (The sacred water pot finial) -->
  <!-- Sprout -->
  <path d="M 256, 76 L 256, 62" stroke="#D4A843" stroke-width="3" stroke-linecap="round" />
